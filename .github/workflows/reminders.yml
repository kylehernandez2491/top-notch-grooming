name: Send appointment reminders

# Managed functions in Static Web Apps only support HTTP triggers, so this schedule stands in for a
# timer trigger. The endpoint is idempotent: each appointment gets at most one reminder.
on:
  schedule:
    - cron: '7 * * * *' # hourly, at :07 to avoid the top-of-hour rush on GitHub's scheduler
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          HOST: ${{ vars.SWA_HOSTNAME }}
          JOBS_KEY: ${{ secrets.JOBS_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "https://${HOST}/api/jobs/reminders" \
            -H "x-jobs-key: ${JOBS_KEY}" \
            -H "Content-Length: 0"
